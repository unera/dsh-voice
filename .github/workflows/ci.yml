name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        # `synth=host` converts the provider's WAV to OGG/Opus, and the tests of the
        # spoken reply do the same: without ffmpeg on PATH they fail, so a green CI
        # run means the path works.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        # Both are development-only: `@deepseek-ai/schemastery` is a peer of the host
        # that declares the Config schema, and `esbuild` builds the client half. A
        # checkout with neither cannot even import `index.mjs`.
        run: npm install --no-audit --no-fund
      - run: npm test
